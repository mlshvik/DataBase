name: Deploy Lab5 to EC2

on:
  push:
    branches: [ "lab5" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload App to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}   # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "lab5/tracking_system_backend/App/**"
          target: "/home/ubuntu/lab5"         
          rm: true
          overwrite: true
          strip_components: 2                 
      
      - name: Bootstrap venv, install deps, restart service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/ubuntu/lab5
            # sanity check
            ls -la App/requirements.txt || (echo "requirements not found"; find . -maxdepth 4 -name requirements.txt -print; exit 1)
            python3 -m venv .venv || true
            . .venv/bin/activate
            pip install --upgrade pip
            pip install -r App/requirements.txt
            sudo systemctl daemon-reload
            sudo systemctl restart lab5app
            sudo systemctl --no-pager status lab5app | tail -n 50
